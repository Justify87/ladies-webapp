name: Generate uv lock once

on:
  push:
    branches:
      - feature/runtime-bootstrap-ui-cleanup
    paths:
      - .github/workflows/generate-uv-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-bootstrap-ui-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Generate universal lockfile
        run: uv lock
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "Lock Python dependencies with uv"
          git push origin HEAD:feature/runtime-bootstrap-ui-cleanup
