name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Python syntax
        run: python -m compileall -q ladies tools ladies_explorer.py

      - name: Check Explorer JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find ladies/static/explorer -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;

      - name: Focused behavior smoke checks
        run: |
          python - <<'PY'
          import runpy
          import sys
          import types
          from pathlib import Path

          business = runpy.run_path('ladies/business_profiles.py')
          website = business['business_website_url']
          assert website('<a class="cut-text einzelansicht-url" href="https://betrieb.example">Betrieb</a>') == 'https://betrieb.example'
          assert website('<a class="social-link" href="https://social.example">Social</a>') is None
          assert website('<a class="einzelansicht-url">Ohne href</a>') is None

          profile_source = Path('ladies/core/services/profile.py').read_text(encoding='utf-8')
          classifier_block = profile_source.split('def classify_business_profile', 1)[1].split('def load', 1)[0]
          assert 'ingest_profile' not in classifier_block
          repository_source = Path('ladies/core/repositories/search.py').read_text(encoding='utf-8')
          assert 'BUSINESS_PROFILE_SOURCE = "BUSINESS_PROFILE"' in repository_source
          assert '**classification' in repository_source

          detector_source = Path('ladies/pricing/detector.py').read_text(encoding='utf-8')
          assert 'import re' not in detector_source
          detector_namespace = {}
          exec(
              detector_source.replace(
                  'from .schema import PRICE_DURATION_OPTIONS',
                  'PRICE_DURATION_OPTIONS = (15, 20, 30, 45, 60, 90, 120)',
              ),
              detector_namespace,
          )
          detector = detector_namespace['PriceMessageDetector'](['anal', 'zungenkuss', 'französisch'])
          assert detector.detect('30 100 60 160').is_price_message
          assert detector.detect('anal +50').is_price_message
          assert detector.detect('100', previous_outgoing='Was kostet 30 Minuten?').is_price_message
          assert detector.detect('10045 Minuten').is_price_message
          assert not detector.detect('Bin gegen 18 Uhr da').is_price_message
          assert not detector.detect('Treffen 60 Minuten um 18 Uhr').is_price_message
          assert not detector.detect('30.10. um 18:30').is_price_message

          model_source = Path('ladies/pricing/model_runtime.py').read_text(encoding='utf-8')
          assert 'extract_price_proposal' in model_source
          assert '"-j"' in model_source
          assert '.find("{")' not in model_source
          assert 'subprocess.TimeoutExpired' in model_source
          assert not Path('ladies/pricing/normalize.py').exists()
          assert not Path('ladies/pricing/rules.py').exists()
          assert not Path('ladies/pricing/signal.py').exists()

          grounding_source = Path('ladies/pricing/grounding.py').read_text(encoding='utf-8')
          assert 'import re' not in grounding_source
          assert '_amount_is_grounded' in grounding_source
          assert '_duration_is_grounded' in grounding_source
          pricing_models_source = Path('ladies/pricing/models.py').read_text(encoding='utf-8')
          assert 'class PriceExtractionLocation' in pricing_models_source
          assert 'class PriceListLocationSnapshot' in pricing_models_source
          pricing_service_source = Path('ladies/pricing/service.py').read_text(encoding='utf-8')
          assert '"listing_id" in data' in pricing_service_source
          assert 'extraction.base_price_list_id = base_price_list_id' in pricing_service_source
          assert '_current_proposal_for_listing' in pricing_service_source
          pricing_web_source = Path('ladies/pricing/web.py').read_text(encoding='utf-8')
          assert 'ExternalServiceError' in pricing_web_source

          class ValidationError(ValueError):
              pass
          errors = types.ModuleType('ladies_v9.errors')
          errors.ExternalServiceError = RuntimeError
          errors.ValidationError = ValidationError
          parsing = types.ModuleType('ladies_v9.request_parsing')
          parsing.read_int = lambda payload, key, default, minimum, maximum: max(minimum, min(maximum, int(payload.get(key, default))))
          parsing.read_mapping = lambda payload, key: payload.get(key, {}) or {}
          source = types.ModuleType('ladies_v9.source')
          source.build_filter_path = lambda *args, **kwargs: ''
          source.fetch_search_configured = lambda *args, **kwargs: ([], {})
          source.resolve_location = lambda session, city: ('leipzig', city)
          utils = types.ModuleType('ladies_v9.utils')
          utils.clean_text = lambda value: str(value).strip()
          package = types.ModuleType('ladies_v9')
          sys.modules.update({'ladies_v9': package, 'ladies_v9.errors': errors, 'ladies_v9.request_parsing': parsing, 'ladies_v9.source': source, 'ladies_v9.utils': utils})
          search = runpy.run_path('ladies/core/services/search.py')
          parse = search['parse_search_request']
          assert parse({'radius': 20}, default_city='leipzig', default_radius=20)['radius'] == 20
          try:
              parse({'radius': 25}, default_city='leipzig', default_radius=20)
          except ValidationError:
              pass
          else:
              raise AssertionError('Unsupported radius must be rejected')
          assert search['_RADIUS_RE'].search('meldet Radius 70 km, angefordert waren 20 km').group(1) == '70'
          PY

          node --experimental-default-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { canonicalPricingService, currentSavedPricingExtractionId } from './ladies/static/explorer/js/ux_patch.js';
          import { captureScrollState, updateScrollableRegion } from './ladies/static/explorer/js/app/scroll_state.js';
          import { businessProfileEvidence, visibleSearchRows } from './ladies/static/explorer/js/app/selectors.js';

          assert.equal(businessProfileEvidence({business_profile_known:false,is_business_profile:false},null).businessProfileKnown,false);
          assert.equal(businessProfileEvidence({business_profile_known:true,is_business_profile:false},null).businessProfileKnown,true);
          const businessState={
            search:{
              results:[{advert_id:'1',name:'Betrieb',thumbnail_url:'x',business_profile_known:true,is_business_profile:true}],
              filters:{local:{photosOnly:false,videoOnly:false,hideDislikes:false,hideBusinessProfiles:true,imageMode:'ALL'}}
            },
            profiles:{bundles:{}},
            settings:{values:{replay_likes:true}}
          };
          assert.equal(visibleSearchRows(businessState).length,0);
          businessState.search.filters.local.hideBusinessProfiles=false;
          assert.equal(visibleSearchRows(businessState).length,1);

          const config={filter_groups:[{key:'service',options:[
            {label:'ZK',value:'zungenkuss'},
            {label:'Franz.',value:'franzoesisch'},
            {label:'AV',value:'anal'},
            {label:'erotische Massage',value:'erotische-massage'},
            {label:'Body-to-Body M.',value:'body-to-body-massage'},
            {label:'Girlfriend-Sex',value:'girlfriendsex'},
            {label:'69',value:'69-stellung'}
          ]}]};
          assert.equal(canonicalPricingService({service_key:'zungenkuss',raw_label:'ZK'},config)?.value,'zungenkuss');
          assert.equal(canonicalPricingService({service_key:'franzoesisch',raw_label:'Franz.'},config)?.value,'franzoesisch');
          assert.equal(canonicalPricingService({service_key:null,raw_label:'AV'},config)?.value,'anal');
          assert.equal(canonicalPricingService({service_key:'unknown-old-service',raw_label:'legacy'},config),null);
          assert.equal(currentSavedPricingExtractionId([
            {price_extraction_id:4,status:'ACCEPTED',accepted_price_list_id:10},
            {price_extraction_id:7,status:'ACCEPTED',accepted_price_list_id:11},
            {price_extraction_id:8,status:'ACCEPTED_NO_CHANGE',accepted_price_list_id:11}
          ]),8);
          const messagingSource=fs.readFileSync('./ladies/static/explorer/js/ui/screens/messaging.js','utf8');
          assert.ok(messagingSource.includes('PRICING_DURATIONS=[15,20,30,45,60,90,120]'));
          assert.ok(messagingSource.includes('data-pricing-field="duration"'));
          assert.ok(messagingSource.includes('data-pricing-location'));
          assert.ok(messagingSource.includes('Kein Ort'));
          assert.ok(messagingSource.includes('Bitte prüfen'));
          const overlaysSource=fs.readFileSync('./ladies/static/explorer/js/ui/screens/overlays.js','utf8');
          assert.ok(overlaysSource.includes('pricingLocationLabel'));

          function hostWithRoots(roots,nextRoots=[]){
            let writes=0;
            return {
              roots,
              nextRoots,
              lastSelector:null,
              get writes(){return writes;},
              querySelectorAll(selector){this.lastSelector=selector;return this.roots;},
              set innerHTML(value){this.html=value;writes+=1;this.roots=this.nextRoots;}
            };
          }

          const oldRoot={dataset:{scrollKey:'main'},id:'',scrollTop:640,scrollLeft:3};
          const replacementRoot={dataset:{scrollKey:'main'},id:'',scrollTop:0,scrollLeft:0};
          const screen=hostWithRoots([oldRoot],[replacementRoot]);
          const snapshot=captureScrollState(screen);
          let result=updateScrollableRegion(screen,'body-v2',{previousHtml:'body-v1',snapshot});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,true);
          assert.equal(replacementRoot.scrollTop,640);
          assert.equal(replacementRoot.scrollLeft,3);

          const writesAfterRestore=screen.writes;
          result=updateScrollableRegion(screen,'body-v2',{previousHtml:'body-v2',snapshot:captureScrollState(screen)});
          assert.equal(result.replaced,false);
          assert.equal(screen.writes,writesAfterRestore);

          const freshRoot={dataset:{scrollKey:'main'},id:'',scrollTop:88,scrollLeft:4};
          screen.nextRoots=[freshRoot];
          result=updateScrollableRegion(screen,'body-new-route',{previousHtml:'body-v2',force:true,reset:true});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,false);
          assert.equal(freshRoot.scrollTop,0);
          assert.equal(freshRoot.scrollLeft,0);

          const oldSheet={dataset:{},id:'',scrollTop:215,scrollLeft:0};
          const newSheet={dataset:{},id:'',scrollTop:0,scrollLeft:0};
          const overlay=hostWithRoots([oldSheet],[newSheet]);
          const sheetSnapshot=captureScrollState(overlay,'.bottom-sheet');
          assert.equal(overlay.lastSelector,'.bottom-sheet');
          result=updateScrollableRegion(overlay,'sheet-v2',{previousHtml:'sheet-v1',snapshot:sheetSnapshot,selector:'.bottom-sheet'});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,true);
          assert.equal(newSheet.scrollTop,215);
          JS

          node --experimental-default-type=module tools/check_search_intelligence.mjs
          node --experimental-default-type=module tools/check_har_runtime_fixes.mjs

      - name: Check project metadata syntax
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              tomllib.load(handle)

          for filename in (
              'ladies/messaging/whatsapp_worker/package.json',
              'ladies/messaging/whatsapp_worker/package-lock.json',
          ):
              json.loads(Path(filename).read_text(encoding='utf-8'))
          PY