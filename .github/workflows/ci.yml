name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Python syntax
        run: python -m compileall -q ladies tools ladies_explorer.py

      - name: Check Explorer JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find ladies/static/explorer -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;

      - name: Focused behavior smoke checks
        run: |
          python - <<'PY'
          import runpy
          import sys
          import types

          normalize = runpy.run_path('ladies/pricing/normalize.py')
          text = '10045 Minuten\n130 Std'
          pairs = {(row['duration_minutes'], row['amount_cents']) for row in normalize['extract_price_duration_pairs'](text)}
          durations = {row['minutes'] for row in normalize['extract_durations'](text)}
          amounts = {row['amount_cents'] for row in normalize['extract_money'](text)}
          assert (45, 10000) in pairs and (60, 13000) in pairs
          assert {45, 60}.issubset(durations)
          assert {10000, 13000}.issubset(amounts)

          class ValidationError(ValueError):
              pass
          errors = types.ModuleType('ladies_v9.errors')
          errors.ExternalServiceError = RuntimeError
          errors.ValidationError = ValidationError
          parsing = types.ModuleType('ladies_v9.request_parsing')
          parsing.read_int = lambda payload, key, default, minimum, maximum: max(minimum, min(maximum, int(payload.get(key, default))))
          parsing.read_mapping = lambda payload, key: payload.get(key, {}) or {}
          source = types.ModuleType('ladies_v9.source')
          source.build_filter_path = lambda *args, **kwargs: ''
          source.fetch_search_configured = lambda *args, **kwargs: ([], {})
          source.resolve_location = lambda session, city: ('leipzig', city)
          utils = types.ModuleType('ladies_v9.utils')
          utils.clean_text = lambda value: str(value).strip()
          package = types.ModuleType('ladies_v9')
          sys.modules.update({'ladies_v9': package, 'ladies_v9.errors': errors, 'ladies_v9.request_parsing': parsing, 'ladies_v9.source': source, 'ladies_v9.utils': utils})
          search = runpy.run_path('ladies/core/services/search.py')
          parse = search['parse_search_request']
          assert parse({'radius': 20}, default_city='leipzig', default_radius=20)['radius'] == 20
          try:
              parse({'radius': 25}, default_city='leipzig', default_radius=20)
          except ValidationError:
              pass
          else:
              raise AssertionError('Unsupported radius must be rejected')
          assert search['_RADIUS_RE'].search('meldet Radius 70 km, angefordert waren 20 km').group(1) == '70'
          PY

          node --experimental-default-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { canonicalPricingService, currentSavedPricingExtractionId } from './ladies/static/explorer/js/ux_patch.js';
          import { captureScrollState, updateScrollableRegion } from './ladies/static/explorer/js/app/scroll_state.js';

          const config={filter_groups:[{key:'service',options:[
            {label:'ZK',value:'zungenkuss'},
            {label:'Franz.',value:'franzoesisch'},
            {label:'AV',value:'anal'},
            {label:'erotische Massage',value:'erotische-massage'},
            {label:'Body-to-Body M.',value:'body-to-body-massage'},
            {label:'Girlfriend-Sex',value:'girlfriendsex'},
            {label:'69',value:'69-stellung'}
          ]}]};
          assert.equal(canonicalPricingService({service_key:'KISSING',raw_label:'Küssen'},config)?.value,'zungenkuss');
          assert.equal(canonicalPricingService({service_key:'FRENCH',raw_label:'Französisch'},config)?.value,'franzoesisch');
          assert.equal(canonicalPricingService({service_key:'MASSAGE',raw_label:'Body to Body'},config)?.value,'body-to-body-massage');
          assert.equal(canonicalPricingService({service_key:'GFE',raw_label:'GFE'},config)?.value,'girlfriendsex');
          assert.equal(canonicalPricingService({service_key:'SIXTY_NINE',raw_label:'69'},config)?.value,'69-stellung');
          assert.equal(canonicalPricingService({service_key:'unknown-old-service',raw_label:'legacy'},config),null);
          assert.equal(currentSavedPricingExtractionId([
            {price_extraction_id:4,status:'ACCEPTED',accepted_price_list_id:10},
            {price_extraction_id:7,status:'ACCEPTED',accepted_price_list_id:11},
            {price_extraction_id:8,status:'ACCEPTED_NO_CHANGE',accepted_price_list_id:11}
          ]),8);

          function hostWithRoots(roots,nextRoots=[]){
            let writes=0;
            return {
              roots,
              nextRoots,
              lastSelector:null,
              get writes(){return writes;},
              querySelectorAll(selector){this.lastSelector=selector;return this.roots;},
              set innerHTML(value){this.html=value;writes+=1;this.roots=this.nextRoots;}
            };
          }

          const oldRoot={dataset:{scrollKey:'main'},id:'',scrollTop:640,scrollLeft:3};
          const replacementRoot={dataset:{scrollKey:'main'},id:'',scrollTop:0,scrollLeft:0};
          const screen=hostWithRoots([oldRoot],[replacementRoot]);
          const snapshot=captureScrollState(screen);
          let result=updateScrollableRegion(screen,'body-v2',{previousHtml:'body-v1',snapshot});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,true);
          assert.equal(replacementRoot.scrollTop,640);
          assert.equal(replacementRoot.scrollLeft,3);

          const writesAfterRestore=screen.writes;
          result=updateScrollableRegion(screen,'body-v2',{previousHtml:'body-v2',snapshot:captureScrollState(screen)});
          assert.equal(result.replaced,false);
          assert.equal(screen.writes,writesAfterRestore);

          const freshRoot={dataset:{scrollKey:'main'},id:'',scrollTop:88,scrollLeft:4};
          screen.nextRoots=[freshRoot];
          result=updateScrollableRegion(screen,'body-new-route',{previousHtml:'body-v2',force:true,reset:true});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,false);
          assert.equal(freshRoot.scrollTop,0);
          assert.equal(freshRoot.scrollLeft,0);

          const oldSheet={dataset:{},id:'',scrollTop:215,scrollLeft:0};
          const newSheet={dataset:{},id:'',scrollTop:0,scrollLeft:0};
          const overlay=hostWithRoots([oldSheet],[newSheet]);
          const sheetSnapshot=captureScrollState(overlay,'.bottom-sheet');
          assert.equal(overlay.lastSelector,'.bottom-sheet');
          result=updateScrollableRegion(overlay,'sheet-v2',{previousHtml:'sheet-v1',snapshot:sheetSnapshot,selector:'.bottom-sheet'});
          assert.equal(result.replaced,true);
          assert.equal(result.restored,true);
          assert.equal(newSheet.scrollTop,215);
          JS

      - name: Check project metadata syntax
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              tomllib.load(handle)

          for filename in (
              'ladies/messaging/whatsapp_worker/package.json',
              'ladies/messaging/whatsapp_worker/package-lock.json',
          ):
              json.loads(Path(filename).read_text(encoding='utf-8'))
          PY
