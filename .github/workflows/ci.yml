name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Core / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ladies/messaging/whatsapp_worker/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.12
          npm ci --prefix ladies/messaging/whatsapp_worker --omit=dev --no-audit --no-fund

      - name: Compile and import Python application
        run: |
          uv run python -m compileall -q ladies tools ladies_explorer.py
          uv run python -c "import ladies_v9.app, nodeenv, ladies_explorer; assert ladies_explorer._project_ready()"

      - name: Run core Python tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_portable_*.py' -print | sort)
          test "${#TEST_FILES[@]}" -gt 0
          uv run python -m unittest -v "${TEST_FILES[@]}"

      - name: Verify JavaScript and WhatsApp worker
        shell: bash
        run: |
          set -euo pipefail
          node --check ladies/messaging/whatsapp_worker/worker.mjs
          find ladies/static -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;
          node -e "const p=require('./ladies/messaging/whatsapp_worker/node_modules/@whiskeysockets/baileys/package.json'); if(p.version!=='7.0.0-rc14') throw new Error('Unexpected Baileys '+p.version); console.log('Baileys '+p.version)"

      - name: Verify self-healing bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .bootstrap-test
          LADIES_BOOTSTRAP_CHECK_ONLY=1 .bootstrap-test/bin/python ladies_explorer.py
          .bootstrap-test/bin/python -c "import ladies_v9.app, nodeenv, flask, ladies_explorer; assert ladies_explorer._project_ready()"

  python-313:
    name: Compatibility / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13

      - name: Compile and import Python application
        run: |
          uv run python -m compileall -q ladies tools ladies_explorer.py
          uv run python -c "import ladies_v9.app, nodeenv, ladies_explorer; assert ladies_explorer._project_ready()"

      - name: Run core Python tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_portable_*.py' -print | sort)
          test "${#TEST_FILES[@]}" -gt 0
          uv run python -m unittest -v "${TEST_FILES[@]}"

  browser:
    name: Browser smoke / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install application and browser-test dependencies
        run: |
          uv sync --locked --python 3.12
          npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps "${{ matrix.engine }}"

      - name: Run V13 browser smoke
        shell: bash
        env:
          LADIES_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          uv run python tests/browser/server.py > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat browser-server.log
            exit 1
          fi
          node tests/browser/explorer.mjs
