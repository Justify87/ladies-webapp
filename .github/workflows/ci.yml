name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Python syntax
        run: python -m compileall -q ladies tools ladies_explorer.py

      - name: Check Explorer JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find ladies/static/explorer -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;

      - name: Check project metadata syntax
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              tomllib.load(handle)

          for filename in (
              'ladies/messaging/whatsapp_worker/package.json',
              'ladies/messaging/whatsapp_worker/package-lock.json',
          ):
              json.loads(Path(filename).read_text(encoding='utf-8'))
          PY
