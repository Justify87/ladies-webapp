name: Sync WhatsApp PR with main

on:
  push:
    branches:
      - fix/whatsapp-reconnect-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-reconnect-sync
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate merged tree
        run: |
          python -m compileall -q ladies/messaging tools/check_whatsapp_reconnect_sync.py
          node --check ladies/messaging/whatsapp_worker/worker_v2.mjs
          python tools/check_whatsapp_reconnect_sync.py
          python tools/check_messaging_architecture.py backend
          python tools/check_messaging_architecture.py worker
      - name: Remove helper and push
        run: |
          git rm .github/workflows/_sync-whatsapp-pr-main.yml
          git commit -m 'Sync WhatsApp reconnect work with current main'
          git push origin HEAD:fix/whatsapp-reconnect-sync
