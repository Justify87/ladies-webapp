name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/v*.md'

permissions:
  contents: write

concurrency:
  group: ladies-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve changed release note
        id: release
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t NOTES < <(git diff --name-only "$BEFORE" "$AFTER" -- '.github/release-notes/v*.md')
          if [ "${#NOTES[@]}" -ne 1 ]; then
            echo "Expected exactly one changed release note, found ${#NOTES[@]}" >&2
            exit 1
          fi
          NOTE_FILE="${NOTES[0]}"
          TAG="$(basename "$NOTE_FILE" .md)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release note name: $NOTE_FILE" >&2; exit 1; }
          echo "note_file=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize versions
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not update version in pyproject.toml')
          path.write_text(updated, encoding='utf-8')
          PY
          npm --prefix ladies/messaging/whatsapp_worker version "$VERSION" --no-git-tag-version --allow-same-version
          uv lock

      - name: Commit synchronized version
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock ladies/messaging/whatsapp_worker/package.json ladies/messaging/whatsapp_worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release V${VERSION}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTE_FILE: ${{ steps.release.outputs.note_file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "Ladies Explorer V${VERSION}" \
            --notes-file "$NOTE_FILE"
