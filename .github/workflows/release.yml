name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ladies/messaging/whatsapp_worker/package-lock.json

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          version = tag[1:]

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          worker = json.loads(Path('ladies/messaging/whatsapp_worker/package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('ladies/messaging/whatsapp_worker/package-lock.json').read_text(encoding='utf-8'))
          note = Path('.github/release-notes') / f'{tag}.md'

          observed = {
              'pyproject.toml': str(project['project']['version']),
              'package.json': str(worker['version']),
              'package-lock.json': str(lock['version']),
              'package-lock root package': str(lock['packages']['']['version']),
          }
          mismatches = [f'{name}={value}' for name, value in observed.items() if value != version]
          if mismatches:
              raise SystemExit('Release version mismatch: ' + ', '.join(mismatches) + f'; tag={tag}')
          if not note.is_file() or not note.read_text(encoding='utf-8').strip():
              raise SystemExit(f'Missing or empty release note: {note}')
          PY

      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.12
          npm ci --prefix ladies/messaging/whatsapp_worker --omit=dev --no-audit --no-fund

      - name: Build portable release
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/build_release.py --output dist --commit "${GITHUB_SHA}"
          unzip -t "dist/ladies-explorer-${GITHUB_REF_NAME}.zip"

      - name: Verify embedded release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          archive = Path('dist') / f'ladies-explorer-{tag}.zip'
          with zipfile.ZipFile(archive) as bundle:
              manifest = json.loads(bundle.read('release-manifest.json'))

          expected = {
              'tag': tag,
              'app_version': tag[1:],
              'commit': sha,
              'entrypoint': 'ladies_explorer.py',
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ladies-explorer-${{ github.ref_name }}
          path: dist/ladies-explorer-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ladies-explorer-${{ github.ref_name }}
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET="dist/ladies-explorer-${TAG}.zip"
          NOTE_FILE=".github/release-notes/${TAG}.md"
          test -f "$ASSET"
          test -s "$NOTE_FILE"
          gh release create "$TAG" "$ASSET" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Ladies Explorer V${VERSION}" \
            --notes-file "$NOTE_FILE"
