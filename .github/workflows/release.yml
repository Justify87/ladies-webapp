name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - '.github/release-notes/v*.md'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.meta.outputs.exists }}
      note_file: ${{ steps.meta.outputs.note_file }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve release metadata
        id: resolve
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            NOTE_FILE=".github/release-notes/${TAG}.md"
          else
            mapfile -t NOTES < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- '.github/release-notes/v*.md')
            if [ "${#NOTES[@]}" -ne 1 ]; then
              echo "Expected exactly one changed release note, found ${#NOTES[@]}" >&2
              exit 1
            fi
            NOTE_FILE="${NOTES[0]}"
            TAG="$(basename "$NOTE_FILE" .md)"
          fi

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          test -s "$NOTE_FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "note_file=$NOTE_FILE" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize release version
        if: github.ref_type != 'tag' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not update version in pyproject.toml')
          path.write_text(updated, encoding='utf-8')
          PY
          npm --prefix ladies/messaging/whatsapp_worker version "$VERSION" --no-git-tag-version --allow-same-version
          uv lock

      - name: Commit synchronized version
        if: github.ref_type != 'tag' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock ladies/messaging/whatsapp_worker/package.json ladies/messaging/whatsapp_worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release V${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create release tag
        if: github.ref_type != 'tag' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"

      - name: Export final release candidate
        id: meta
        shell: bash
        env:
          EXISTS: ${{ steps.existing.outputs.exists }}
          NOTE_FILE: ${{ steps.resolve.outputs.note_file }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_SHA="$GITHUB_SHA"
          else
            RELEASE_SHA="$(git rev-parse HEAD)"
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "note_file=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.release_sha }}
    permissions:
      contents: read

  platform:
    name: Platform gate
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    uses: ./.github/workflows/platform.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.release_sha }}
    permissions:
      contents: read

  build:
    name: Build and verify release artifact
    needs: [prepare, ci, platform]
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ladies/messaging/whatsapp_worker/package-lock.json

      - name: Verify tag and version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ['TAG']
          version = os.environ['VERSION']
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          worker = json.loads(Path('ladies/messaging/whatsapp_worker/package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('ladies/messaging/whatsapp_worker/package-lock.json').read_text(encoding='utf-8'))
          note = Path('.github/release-notes') / f'{tag}.md'

          observed = {
              'pyproject.toml': str(project['project']['version']),
              'package.json': str(worker['version']),
              'package-lock.json': str(lock['version']),
              'package-lock root package': str(lock['packages']['']['version']),
          }
          mismatches = [f'{name}={value}' for name, value in observed.items() if value != version]
          if mismatches:
              raise SystemExit('Release version mismatch: ' + ', '.join(mismatches) + f'; tag={tag}')
          if not note.is_file() or not note.read_text(encoding='utf-8').strip():
              raise SystemExit(f'Missing or empty release note: {note}')
          print(f'Release metadata verified for {tag}')
          PY

      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.12
          npm ci --prefix ladies/messaging/whatsapp_worker --omit=dev --no-audit --no-fund

      - name: Verify release package contract
        run: uv run python -m unittest -v tests/test_release_package.py

      - name: Build portable release once
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/build_release.py --output dist --commit "$RELEASE_SHA"
          unzip -t "dist/ladies-explorer-${TAG}.zip"

      - name: Verify embedded release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ['TAG']
          sha = os.environ['RELEASE_SHA']
          archive = Path('dist') / f'ladies-explorer-{tag}.zip'
          with zipfile.ZipFile(archive) as bundle:
              manifest = json.loads(bundle.read('release-manifest.json'))

          expected = {
              'tag': tag,
              'app_version': tag[1:],
              'commit': sha,
              'entrypoint': 'ladies_explorer.py',
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          print(f'Manifest verified in {archive}')
          PY

      - name: Upload verified release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ladies-explorer-${{ needs.prepare.outputs.tag }}
          path: dist/ladies-explorer-${{ needs.prepare.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release candidate for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download verified release artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ladies-explorer-${{ needs.prepare.outputs.tag }}
          path: dist

      - name: Publish release without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_FILE: ${{ needs.prepare.outputs.note_file }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="dist/ladies-explorer-${TAG}.zip"
          test -f "$ASSET"
          test -s "$NOTE_FILE"
          gh release create "$TAG" "$ASSET" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Ladies Explorer V${VERSION}" \
            --notes-file "$NOTE_FILE"
