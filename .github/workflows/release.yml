name: Publish release from notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-notes/v*.md'

permissions:
  contents: write

concurrency:
  group: ladies-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          NOTE_FILE="$(find .github/release-notes -maxdepth 1 -type f -name 'v*.md' | sort -V | tail -n 1)"
          test -n "$NOTE_FILE"
          TAG="$(basename "$NOTE_FILE" .md)"
          VERSION="${TAG#v}"
          echo "note_file=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip already published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install release tooling
        if: steps.existing.outputs.exists != 'true'
        run: python -m pip install uv

      - name: Synchronize project versions
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not update version in pyproject.toml')
          path.write_text(updated, encoding='utf-8')
          PY
          npm --prefix ladies/messaging/whatsapp_worker version "$VERSION" --no-git-tag-version --allow-same-version
          uv lock

      - name: Validate release candidate
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m compileall ladies ladies_explorer.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          cd ladies/messaging/whatsapp_worker
          npm ci --omit=dev --no-audit --no-fund
          node --check worker.mjs
          find ../../static -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;
          node -e "const p=require('./node_modules/@whiskeysockets/baileys/package.json'); if(p.version!=='7.0.0-rc14') throw new Error('Unexpected Baileys '+p.version); console.log(p.version)"

      - name: Commit synchronized version
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock ladies/messaging/whatsapp_worker/package.json ladies/messaging/whatsapp_worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release V${VERSION}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTE_FILE: ${{ steps.release.outputs.note_file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "Ladies Explorer V${VERSION}" \
            --notes-file "$NOTE_FILE"