name: Apply WhatsApp reliability patch

on:
  push:
    branches:
      - fix/whatsapp-reconnect-sync

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-reconnect-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted rewrite
        run: python tools/_apply_whatsapp_reliability.py
      - name: Validate patched sources
        run: |
          python -m compileall -q ladies/messaging tools/check_whatsapp_reconnect_sync.py
          node --check ladies/messaging/whatsapp_worker/worker_v2.mjs
      - name: Commit rewrite
        run: |
          rm tools/_apply_whatsapp_reliability.py .github/workflows/_apply-whatsapp-reliability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WhatsApp reconnect persistence barrier'
          git push origin HEAD:fix/whatsapp-reconnect-sync
