name: Ladies Explorer Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and Python dependencies
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall ladies ladies_explorer.py
      - name: Verify neutral source layout mapping
        run: python -c "import ladies_v9.app, nodeenv; print('package mapping ok')"
      - name: Verify bootstrap dependency state
        run: python -c "import ladies_explorer; assert ladies_explorer._project_ready(); print('bootstrap dependency check ok')"
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Flask smoke test without starting a server
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          from ladies_v9.app import create_app

          class NoNodeWorker:
              def __init__(self, worker_dir, auth_dir, event_handler):
                  self.worker_dir=Path(worker_dir); self.auth_dir=Path(auth_dir); self.event_handler=event_handler
                  self.proc=None; self.state='NOT_CONFIGURED'; self.detail=None; self.qr=None; self.account=None; self.last_connected_at=None
              def dependency_status(self): return False, 'Node.js 20+ fehlt'
              def status(self): return {'state':self.state,'detail':self.detail,'qr_available':False,'account':None,'last_connected_at':None}
              def stop(self): pass

          with tempfile.TemporaryDirectory() as td, patch('ladies_v9.messaging.service_runtime.BaileysWorkerManager', NoNodeWorker):
              root=Path(td)
              app=create_app(db_path=root/'app.sqlite3', data_dir=root/'data')
              client=app.test_client()
              assert client.get('/').status_code == 200
              assert client.get('/api/messaging/status').status_code == 200
              assert client.get('/api/dashboard').status_code == 200
          PY

  bootstrap:
    name: bootstrap-${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create pristine virtualenv
        run: python -m venv .bootstrap-test
      - name: Let launcher repair the pristine environment
        shell: bash
        run: LADIES_BOOTSTRAP_CHECK_ONLY=1 .bootstrap-test/bin/python ladies_explorer.py
      - name: Verify repaired environment after re-exec
        shell: bash
        run: .bootstrap-test/bin/python -c "import ladies_v9.app, nodeenv, flask, ladies_explorer; assert ladies_explorer._project_ready(); print('self-healing bootstrap ok')"

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ladies/messaging/whatsapp_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked worker dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Check worker and browser JavaScript syntax
        run: |
          node --check worker.mjs
          find ../../static -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --check {} \;
      - name: Verify pinned Baileys 7 version
        run: node -e "const p=require('./node_modules/@whiskeysockets/baileys/package.json'); if(p.version!=='7.0.0-rc14') throw new Error('Unexpected Baileys '+p.version); console.log(p.version)"
