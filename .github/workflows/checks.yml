name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/release-notes/**
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ladies/messaging/whatsapp_worker/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm ci --prefix ladies/messaging/whatsapp_worker --omit=dev --no-audit --no-fund

      - name: Verify Python
        run: |
          python -m compileall -q ladies tools ladies_explorer.py
          python -c "import ladies_v9.app, nodeenv, ladies_explorer; assert ladies_explorer._project_ready()"
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify portable release package
        shell: bash
        run: |
          python tools/build_release.py --output .release-test --commit "${GITHUB_SHA}"
          unzip -t .release-test/ladies-explorer-v*.zip

      - name: Verify JavaScript and WhatsApp worker
        shell: bash
        run: |
          node --check ladies/messaging/whatsapp_worker/worker.mjs
          find ladies/static -type f \( -name '*.js' -o -name '*.mjs' \) -print -exec node --experimental-default-type=module --check {} \;
          node -e "const p=require('./ladies/messaging/whatsapp_worker/node_modules/@whiskeysockets/baileys/package.json'); if(p.version!=='7.0.0-rc14') throw new Error('Unexpected Baileys '+p.version); console.log(p.version)"

      - name: Verify self-healing bootstrap
        shell: bash
        run: |
          python -m venv .bootstrap-test
          LADIES_BOOTSTRAP_CHECK_ONLY=1 .bootstrap-test/bin/python ladies_explorer.py
          .bootstrap-test/bin/python -c "import ladies_v9.app, nodeenv, flask, ladies_explorer; assert ladies_explorer._project_ready()"