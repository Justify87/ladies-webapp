name: Apply WhatsApp gateway import fix v2

on:
  push:
    branches:
      - fix/whatsapp-reconnect-sync

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-reconnect-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_fix_whatsapp_gateway_import.py
      - name: Validate targeted behavior and repository architecture
        run: |
          python -m compileall -q ladies/messaging tools/check_whatsapp_reconnect_sync.py
          node --check ladies/messaging/whatsapp_worker/worker_v2.mjs
          python tools/check_whatsapp_reconnect_sync.py
          python tools/check_messaging_architecture.py backend
      - name: Commit clean result
        run: |
          rm tools/_fix_whatsapp_gateway_import.py
          rm .github/workflows/_apply-whatsapp-gateway-import.yml
          rm .github/workflows/_apply-whatsapp-gateway-import-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden WhatsApp reconnect recovery'
          git push origin HEAD:fix/whatsapp-reconnect-sync
