name: Tighten WhatsApp READY barrier

on:
  push:
    branches:
      - fix/whatsapp-reconnect-sync

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-reconnect-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply READY barrier fix
        run: python tools/_tighten_whatsapp_ready.py
      - name: Validate
        run: |
          python -m compileall -q ladies/messaging tools/check_whatsapp_reconnect_sync.py
          node --check ladies/messaging/whatsapp_worker/worker_v2.mjs
          python tools/check_whatsapp_reconnect_sync.py
          python tools/check_messaging_architecture.py backend
          python tools/check_messaging_architecture.py worker
      - name: Commit clean result
        run: |
          rm tools/_tighten_whatsapp_ready.py
          rm .github/workflows/_tighten-whatsapp-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten WhatsApp final sync barrier'
          git push origin HEAD:fix/whatsapp-reconnect-sync
