<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafafd">
  <title>Ladies Explorer</title>
  <link rel="stylesheet" href="/static/explorer/css/tokens.css">
  <link rel="stylesheet" href="/static/explorer/css/base.css">
  <link rel="stylesheet" href="/static/explorer/css/shell.css">
  <link rel="stylesheet" href="/static/explorer/css/components.css">
  <link rel="stylesheet" href="/static/explorer/css/screens.css">
  <script>window.__LADIES_CONFIG__ = {{ config["FRONTEND_CONFIG"]|tojson }};</script>
</head>
<body>
  <div class="stage">
    <div id="app" class="phone">
      <div class="statusbar" aria-hidden="true">
        <span id="statusClock">09:41</span>
        <span class="camera-hole"></span>
        <span class="status-right">
          <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
          <span>5G</span>
          <span class="battery"></span>
        </span>
      </div>
      <header id="appHeader" class="app-header"></header>
      <main id="screenHost" class="screen-host"></main>
      <nav id="bottomNav" class="bottom-nav" aria-label="Hauptnavigation"></nav>
      <div id="overlayHost"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script type="module" src="/static/explorer/js/bootstrap.js"></script>
</body>
</html>
