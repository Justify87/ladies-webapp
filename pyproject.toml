[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ladies-explorer"
version = "10.0.14"
description = "Local Ladies.de explorer with identity, history and media archiving"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=10,<15",
  "SQLAlchemy>=2,<2.1",
  "orjson>=3.10,<4",
  "qrcode>=8,<9",
  "nodeenv>=1.10,<2",
  "imageio-ffmpeg>=0.6,<1",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "opentelemetry-instrumentation-flask>=0.66b1,<0.67",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
  "opentelemetry-instrumentation-logging>=0.66b1,<0.67",
  "pyinstrument>=5.1.3,<6",
]

[tool.setuptools]
package-dir = {"ladies_v9" = "ladies"}
packages = [
  "ladies_v9",
  "ladies_v9.core",
  "ladies_v9.core.repositories",
  "ladies_v9.core.services",
  "ladies_v9.messaging",
  "ladies_v9.pricing",
]
include-package-data = true

[tool.setuptools.package-data]
ladies_v9 = [
  "templates/*.html",
  "static/*.svg",
  "static/explorer/css/*.css",
  "static/explorer/css/components/*.css",
  "static/explorer/css/screens/*.css",
  "static/explorer/js/*.js",
  "static/explorer/js/api/*.js",
  "static/explorer/js/app/*.js",
  "static/explorer/js/data/*.js",
  "static/explorer/js/effects/*.js",
  "static/explorer/js/shared/*.js",
  "static/explorer/js/ui/*.js",
  "static/explorer/js/ui/screens/*.js",
  "messaging/whatsapp_worker/*.mjs",
  "messaging/whatsapp_worker/*.json",
]
