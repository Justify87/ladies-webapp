[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ladies-explorer"
version = "9.3.0"
description = "Local mobile-first Ladies Explorer"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=10,<15",
  "SQLAlchemy>=2.0,<3",
  "orjson>=3.10,<4",
  "qrcode>=8,<9",
  "nodeenv>=1.10,<2",
  "imageio-ffmpeg>=0.6,<1",
]

[tool.setuptools]
packages = ["ladies_v9", "ladies_v9.messaging", "ladies_v9.pricing"]
py-modules = ["ladies_explorer"]
include-package-data = true

[tool.setuptools.package-dir]
ladies_v9 = "ladies"
"ladies_v9.messaging" = "ladies/messaging"
"ladies_v9.pricing" = "ladies/pricing"

[tool.setuptools.package-data]
ladies_v9 = ["static/*", "templates/*"]
"ladies_v9.messaging" = ["whatsapp_worker/*"]
